name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows packages
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up locked .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Verify exact v2 project version and immutable tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG_BUILD: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          [xml]$props = Get-Content -LiteralPath Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          if ($version -cne '2.0.1') {
            throw "Directory.Build.props must contain exact v2.0.1; actual: $version"
          }

          if ($env:IS_TAG_BUILD -ceq 'true') {
            if ($env:RELEASE_TAG -ceq 'v1.0.0') {
              throw 'v1.0.0 is immutable and cannot be used for EMKE AI Marker v2.'
            }

            $expectedTag = "v$version"
            if ($env:RELEASE_TAG -cne $expectedTag) {
              throw "Tag $env:RELEASE_TAG does not match project version $expectedTag."
            }
          }

      - name: Build and verify release package
        shell: pwsh
        run: pwsh scripts/build-release.ps1

      - name: Upload verified workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: emke-ai-marker-windows-${{ github.run_id }}
          path: |
            dist/emke-ai-marker-v2.0.1-windows-x64.zip
            dist/emke-ai-marker-v2.0.1-windows-x64-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: emke-ai-marker-windows-${{ github.run_id }}
          path: dist

      - name: Create GitHub Release for existing tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $zipFiles = @(Get-ChildItem -LiteralPath dist -Filter '*.zip' -File)
          if ($zipFiles.Count -ne 1) {
            throw "Expected exactly one ZIP in dist, found $($zipFiles.Count)."
          }

          $checksumPath = Join-Path $PWD 'dist\SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
            throw "Missing checksum file: $checksumPath"
          }

          $setupPath = Join-Path $PWD 'dist\emke-ai-marker-v2.0.1-windows-x64-setup.exe'
          if (-not (Test-Path -LiteralPath $setupPath -PathType Leaf)) {
            throw "Missing Setup installer: $setupPath"
          }

          gh release create $env:RELEASE_TAG `
            $zipFiles[0].FullName `
            $setupPath `
            $checksumPath `
            --repo $env:GH_REPO `
            --verify-tag `
            --generate-notes `
            --title $env:RELEASE_TAG
