name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Windows / .NET 10
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up locked .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        shell: pwsh
        run: dotnet restore Emke.AiMarker.sln --locked-mode

      - name: Fetch and export locked ExifTool
        shell: pwsh
        run: |
          pwsh scripts/fetch-exiftool.ps1
          $exifTool = (Resolve-Path .\runtime\exiftool\exiftool.exe).Path
          "EMKE_EXIFTOOL=$exifTool" >> $env:GITHUB_ENV

      - name: Test complete solution with real ExifTool
        shell: pwsh
        run: dotnet test Emke.AiMarker.sln -c Release --no-restore
